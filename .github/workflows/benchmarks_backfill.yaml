# Manual two-phase workflow for backfilling historical commits/nightlies and
# replaying saved Bencher Metric Format (BMF) artifacts into Bencher.
#
# Bencher assigns branch version numbers (`v1, v2, ...`) and rolling statistical
# threshold windows strictly in report arrival order (`--backdate` only sets
# display timestamps, not branch order). To backfill historical commits without
# scrambling the branch timeline or waiting for serialized runs:
#
# 1. `mode: collect` benchmarks a historical `trunk` commit SHA or nightly tag
#    in parallel on Linux (`ubuntu-22.04` and `ubuntu-22.04-arm`). It overlays
#    `trunk`'s `.github/actions` and benchmarking scripts onto the historical
#    checkout and saves `bencher-bmf-<tier>-<runner>-<sha>` artifacts without
#    touching Bencher.
#
# 2. `mode: replay` gathers saved BMF artifacts across both this workflow and
#    live `benchmarks.yaml` runs, orders commits `oldest -> newest` along
#    `trunk`'s first-parent history, optionally resets the Bencher branch head
#    once on the oldest commit (`reset_branch: true`), and uploads each report
#    with `--backdate`.
name: Benchmarks Backfill

on:
  workflow_dispatch:
    inputs:
      mode:
        description:
          'Collect BMF artifacts for a historical ref, or replay saved artifacts
          to Bencher'
        required: false
        default: 'collect'
        type: choice
        options:
          - collect
          - replay
      tier:
        description:
          'Benchmark suite tier (continuous -> trunk, nightly -> nightly)'
        required: false
        default: 'nightly'
        type: choice
        options:
          - continuous
          - nightly
      ref:
        description:
          'For collect: 40-char commit SHA or nightly tag to benchmark'
        required: false
        default: ''
        type: string
      since_ref:
        description:
          'For replay: optional oldest commit ref/tag on trunk to include'
        required: false
        default: ''
        type: string
      reset_branch:
        description:
          'For replay: reset Bencher branch head before uploading oldest->newest'
        required: false
        default: false
        type: boolean
      dry_run:
        description:
          'For replay: validate and print ordered replay plan without uploading'
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  collect:
    name: Collect BMF (${{ inputs.tier }}, ${{ matrix.runner }})
    if: inputs.mode == 'collect'
    # Include `github.run_id` so multiple historical commits can be measured in
    # parallel during a backfill.
    concurrency:
      group:
        ${{ github.workflow }}-collect-${{ matrix.runner }}-${{ github.run_id }}
      cancel-in-progress: false
    timeout-minutes: 90
    permissions:
      contents: read # For actions/checkout.
    strategy:
      fail-fast: false
      matrix:
        # Backfill only Linux x86-64 and ARM64 to avoid macOS runner limits.
        runner: ['ubuntu-22.04', 'ubuntu-22.04-arm']
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          # When adding endpoints, see README.md.
          # prettier-ignore
          allowed-endpoints: >
            *.blob.storage.azure.net:443
            *.githubapp.com:443
            *.sourceforge.net:443
            api.github.com:443
            api.ipify.org:443
            bcr.bazel.build:443
            download.gnome.org:443
            downloads.sourceforge.net:443
            files.pythonhosted.org:443
            formulae.brew.sh:443
            github.com:443
            go.dev:443
            index.crates.io:443
            mirror.bazel.build:443
            mirrors.kernel.org:443
            nodejs.org:443
            oauth2.googleapis.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            releases.bazel.build:443
            results-receiver.actions.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            storage.googleapis.com:443
            uploads.github.com:443
            www.googleapis.com:443

      - name: Checkout latest benchmarking tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Historical commits predate `run_bencher.py` and recent fixes to
      # `bench_runner.py` / `.github/actions`, so preserve `trunk`'s copies
      # before detaching the target C++/Carbon source tree.
      - name: Checkout target ref and overlay benchmarking tools
        id: source
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [[ -z "$INPUT_REF" ]]; then
            echo "::error::Input 'ref' is required when mode='collect'."
            exit 1
          fi
          if [[ ! "$INPUT_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ || "$INPUT_REF" == *..* ]]; then
            echo "::error::Invalid target ref: $INPUT_REF"
            exit 1
          fi

          latest_dir="$RUNNER_TEMP/bencher-latest"
          mkdir -p "$latest_dir"
          cp -R .github/actions "$latest_dir/actions"
          cp scripts/bench_runner.py "$latest_dir/bench_runner.py"
          cp toolchain/benchmarking/bencher_suites.py "$latest_dir/bencher_suites.py"
          cp toolchain/benchmarking/run_bencher.py "$latest_dir/run_bencher.py"

          git fetch --depth=1 origin "$INPUT_REF"
          git checkout --detach FETCH_HEAD

          rm -rf .github/actions
          mkdir -p .github scripts toolchain/benchmarking
          cp -R "$latest_dir/actions" .github/actions
          cp "$latest_dir/bench_runner.py" scripts/bench_runner.py
          cp "$latest_dir/bencher_suites.py" toolchain/benchmarking/bencher_suites.py
          cp "$latest_dir/run_bencher.py" toolchain/benchmarking/run_bencher.py

          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up remote cache access
        id: cache-setup
        env:
          REMOTE_CACHE_KEY: ${{ secrets.CARBON_BUILDS_GITHUB }}
        run: |
          if [[ -n "$REMOTE_CACHE_KEY" ]]; then
            echo "$REMOTE_CACHE_KEY" | base64 -d > "$HOME/remote_cache_key.json"
            echo "remote_cache_upload=--google_credentials=$HOME/remote_cache_key.json" \
                >> "$GITHUB_OUTPUT"
          else
            echo "remote_cache_upload=--remote_upload_local_results=false" \
                >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/build-setup-common
        with:
          matrix_runner: ${{ matrix.runner }}
          remote_cache_upload:
            ${{ steps.cache-setup.outputs.remote_cache_upload }}

      - name: Run benchmarks
        id: run-bencher
        env:
          # 'libtool_check_unique failed to generate' workaround.
          # https://github.com/bazelbuild/bazel/issues/14113#issuecomment-999794586
          BAZEL_USE_CPP_ONLY_TOOLCHAIN: 1
          BENCH_TIER: ${{ inputs.tier }}
          BMF_FILE: ${{ runner.temp }}/bmf-${{ matrix.runner }}.json
        run: |
          ./toolchain/benchmarking/run_bencher.py run \
            --ci \
            --tier="$BENCH_TIER" \
            --output="$BMF_FILE" \
            --github-output="$GITHUB_OUTPUT"

      - name: Upload BMF artifact
        if: steps.run-bencher.outputs.has_benchmarks == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name:
            bencher-bmf-${{ inputs.tier }}-${{ matrix.runner }}-${{
            steps.source.outputs.target_sha }}
          path: ${{ runner.temp }}/bmf-${{ matrix.runner }}.json

  replay:
    name: Replay BMF artifacts (${{ inputs.tier }})
    if: inputs.mode == 'replay'
    concurrency:
      group: ${{ github.workflow }}-replay-${{ inputs.tier }}
      cancel-in-progress: false
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      actions: read # To list and download BMF artifacts from workflow runs.
      contents: read # For actions/checkout of trunk commit history.
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo: true
          egress-policy: block
          # prettier-ignore
          allowed-endpoints: >
            *.blob.storage.azure.net:443
            api.bencher.dev:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443

      # Fetch commit graph and committer timestamps (`filter: tree:0` skips
      # historical file blobs) so `replay-artifacts` can order commits along
      # `trunk` first-parent history and pass `--backdate`.
      - name: Checkout trunk history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - name: Install Bencher CLI
        if: ${{ !inputs.dry_run }}
        uses: bencherdev/bencher@7de3c69a85380826613050826b4bce062be2f07d # v0.6.16

      - name: Replay BMF artifacts to Bencher
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          BENCH_TIER: ${{ inputs.tier }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESET_BRANCH: ${{ inputs.reset_branch }}
          SINCE_REF: ${{ inputs.since_ref }}
        run: |
          args=("replay-artifacts" "--tier=$BENCH_TIER")
          if [[ -n "$SINCE_REF" ]]; then
            args+=("--since-ref=$SINCE_REF")
          fi
          if [[ "$RESET_BRANCH" == "true" ]]; then
            args+=("--reset-branch")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=("--dry-run")
          fi
          python3 ./toolchain/benchmarking/run_bencher.py "${args[@]}"
